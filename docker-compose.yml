version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      # Supabase env vars should be provided via .env
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - AI_SERVER_URL=http://ai-server:8000
    depends_on:
      - ai-server
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://api:3001
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    depends_on:
      api:
        condition: service_healthy

  ai-server:
    build:
      context: docker/ai-server
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama-puller:
    image: curlimages/curl:latest
    command: >
      sh -c "
      echo 'Waiting for Ollama to be ready...';
      until curl -s -f http://ollama:11434/api/tags; do
        sleep 5;
      done;
      echo 'Ollama is ready. Pulling llava...';
      curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"llava\"}';
      echo 'Finished pulling llava.';
      "
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama_data:
